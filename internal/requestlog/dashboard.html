<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请求日志 · CLIProxyAPI</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d333b;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950;
  --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{font-size:20px;margin:0}
header.top .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.danger{color:var(--red)}
input[type=text],select{background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:22px;font-weight:700;margin-top:4px}
.card .v small{font-size:12px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar-row .name{width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.bar-row .name.mono{font-family:ui-monospace,monospace;font-size:12px}
.bar-row .track{flex:1;height:10px;background:#0d1117;border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff);border-radius:5px}
.bar-row .fill.green{background:linear-gradient(90deg,#238636,#3fb950)}
.bar-row .fill.purple{background:linear-gradient(90deg,#6e40c9,#bc8cff)}
.bar-row .num{width:110px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
td.mono{font-family:ui-monospace,monospace;font-size:12px}
.model-map{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.model-map .req{color:var(--muted)}
.model-map .arrow{color:var(--border)}
.model-map .real{color:var(--green);font-weight:600}
.model-map .real.same{color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.pill.ok{background:rgba(63,185,80,.15);color:var(--green)}
.pill.err{background:rgba(248,81,73,.15);color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted);font-size:13px}
#keygate{position:fixed;inset:0;background:rgba(13,17,23,.92);display:flex;align-items:center;justify-content:center;z-index:50}
#keygate .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;width:360px;max-width:90vw}
#keygate h2{margin:0 0 8px;font-size:17px}
#keygate p{color:var(--muted);font-size:13px;margin:0 0 14px}
#keygate input{width:100%;margin-bottom:12px}
#keygate .err{color:var(--red);font-size:12px;min-height:18px}
.chart{width:100%;height:180px}
.chart .bar{fill:#1f6feb}
.chart .bar.fail{fill:var(--red)}
.chart text{fill:var(--muted);font-size:10px}
.note{color:var(--muted);font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="keygate"><div class="box">
  <h2>请求日志看板</h2>
  <p>请输入管理密钥（与 <code>remote-management</code> 配置的密钥一致），仅保存在当前浏览器会话中。</p>
  <input type="text" id="keyinput" placeholder="Management key" autocomplete="off">
  <div class="err" id="keyerr"></div>
  <button class="btn active" id="keyok" style="width:100%">进入看板</button>
</div></div>

<div class="wrap">
  <header class="top">
    <h1>请求日志</h1><span class="sub" id="dbsub"></span>
    <div class="spacer"></div>
    <button class="btn range active" data-range="24h">24小时</button>
    <button class="btn range" data-range="7d">7天</button>
    <button class="btn range" data-range="30d">30天</button>
    <button class="btn range" data-range="all">全部</button>
    <button class="btn" id="refresh">刷新</button>
    <button class="btn danger" id="logout">退出</button>
  </header>

  <div class="cards" id="cards"></div>

  <div class="panel"><h3>每日请求量</h3><svg class="chart" id="chart-req" viewBox="0 0 600 180" preserveAspectRatio="none"></svg></div>
  <div class="panel"><h3>每日 Token（输入 / 输出）</h3><svg class="chart" id="chart-tok" viewBox="0 0 600 180" preserveAspectRatio="none"></svg></div>

  <div class="grid2">
    <div class="panel"><h3>真实上游模型 Top</h3><div id="by-real"></div><div class="note">即上游实际返回的模型名；与请求名不同时说明发生映射/重定向</div></div>
    <div class="panel"><h3>请求模型 Top</h3><div id="by-model"></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>渠道 Top</h3><div id="by-provider"></div></div>
    <div class="panel"><h3>API Key Top</h3><div id="by-key"></div></div>
  </div>

  <div class="panel">
    <h3>请求明细</h3>
    <div class="filters">
      <input type="text" id="f-search" placeholder="搜索 request_id / trace_id / session_id" style="width:280px">
      <input type="text" id="f-model" placeholder="请求模型" style="width:150px">
      <input type="text" id="f-real" placeholder="真实模型" style="width:150px">
      <input type="text" id="f-provider" placeholder="渠道" style="width:120px">
      <select id="f-failed"><option value="">全部状态</option><option value="1">仅失败</option><option value="0">仅成功</option></select>
      <button class="btn" id="f-go">筛选</button>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>时间</th><th>接口</th><th>API Key</th><th>模型（请求 → 真实）</th><th>渠道</th><th>Token 输入/输出</th><th>延迟</th><th>状态</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="pager"><span id="pageinfo"></span>
      <button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var BASE = location.pathname.replace(/\/dashboard\/?$/,"");
var key = sessionStorage.getItem("rl_key") || "";
var range = "24h", page = 1;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmtN(n){return Number(n||0).toLocaleString("en-US")}
function fmtT(ts){var d=new Date(ts);return d.toLocaleString("zh-CN",{hour12:false})}
function api(path){
  return fetch(BASE+path,{headers:{"X-Management-Key":key}}).then(function(r){
    if(r.status===401||r.status===403){showGate("密钥无效或已过期");throw new Error("auth")}
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
}
function showGate(msg){
  document.getElementById("keygate").style.display="flex";
  if(msg) document.getElementById("keyerr").textContent=msg;
}
document.getElementById("keygate").style.display = key ? "none" : "flex";
document.getElementById("keyok").onclick=function(){
  var v=document.getElementById("keyinput").value.trim();
  if(!v){document.getElementById("keyerr").textContent="请输入密钥";return;}
  key=v; sessionStorage.setItem("rl_key",v);
  document.getElementById("keygate").style.display="none";
  load();
};
document.getElementById("keyinput").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("keyok").click()});
document.getElementById("logout").onclick=function(){sessionStorage.removeItem("rl_key");location.reload()};

function rangeMs(){
  var now=Date.now();
  if(range==="24h")return{from:now-864e5,to:now};
  if(range==="7d")return{from:now-7*864e5,to:now};
  if(range==="30d")return{from:now-30*864e5,to:now};
  return{from:0,to:0};
}
document.querySelectorAll(".btn.range").forEach(function(b){
  b.onclick=function(){document.querySelectorAll(".btn.range").forEach(function(x){x.classList.remove("active")});b.classList.add("active");range=b.dataset.range;page=1;load()};
});
document.getElementById("refresh").onclick=function(){load()};

function barList(el,items,color,fmt){
  var max=0;items.forEach(function(i){if(i.requests>max)max=i.requests});
  el.innerHTML=items.slice(0,10).map(function(i){
    var w=max?Math.round(i.requests/max*100):0;
    return '<div class="bar-row"><div class="name mono" title="'+esc(i.key)+'">'+esc(i.key)+
      '</div><div class="track"><div class="fill '+color+'" style="width:'+w+'%"></div></div>'+
      '<div class="num">'+fmt(i)+'</div></div>';
  }).join("")||'<div class="note">暂无数据</div>';
}
function drawBars(svg,data,getVal,labels){
  var W=600,H=180,pad=24,n=data.length;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  if(!n){svg.innerHTML='<text x="20" y="90">暂无数据</text>';return;}
  var max=0;data.forEach(function(d){var v=getVal(d);if(v>max)max=v});
  if(!max)max=1;
  var bw=Math.min(40,(W-pad*2)/n*0.6),html="";
  data.forEach(function(d,i){
    var v=getVal(d),h=Math.round((H-50)*v/max),x=pad+i*((W-pad*2)/n)+( (W-pad*2)/n-bw)/2,y=H-30-h;
    html+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="'+h+'"><title>'+esc(labels(d))+'</title></rect>';
  });
  var step=Math.ceil(n/8);
  data.forEach(function(d,i){if(i%step)return;var x=pad+i*((W-pad*2)/n)+(W-pad*2)/n/2;
    html+='<text x="'+x.toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(d.day.slice(5))+'</text>'});
  svg.innerHTML=html;
}

function load(){
  if(!key){showGate();return;}
  var r=rangeMs(),q="?from="+r.from+"&to="+r.to;
  api("/stats"+q).then(function(st){
    var ok=st.requests-st.failed, rate=st.requests?Math.round(ok/st.requests*1000)/10:0;
    document.getElementById("cards").innerHTML=
      card("总请求",fmtN(st.requests))+
      card("成功率",rate+"<small> %</small>")+
      card("输入 Tokens",fmtN(st.input_tokens))+
      card("输出 Tokens",fmtN(st.output_tokens))+
      card("总 Tokens",fmtN(st.total_tokens))+
      card("真实模型数",fmtN(st.distinct_real_models),"<small> / 请求模型 "+fmtN(st.distinct_models)+"</small>")+
      card("平均延迟",Math.round(st.avg_latency_ms)+"<small> ms</small>");
    drawBars(document.getElementById("chart-req"),st.by_day,function(d){return d.requests},function(d){return d.day+"  "+d.requests+" 请求"});
    drawBars(document.getElementById("chart-tok"),st.by_day,function(d){return d.total_tokens},function(d){return d.day+"  "+d.total_tokens+" tokens"});
    barList(document.getElementById("by-real"),st.by_real_model,"green",function(i){return fmtN(i.requests)+" 次"});
    barList(document.getElementById("by-model"),st.by_model,"",function(i){return fmtN(i.requests)+" 次"});
    barList(document.getElementById("by-provider"),st.by_provider,"purple",function(i){return fmtN(i.requests)+" 次"});
    barList(document.getElementById("by-key"),st.by_api_key,"",function(i){return fmtN(i.requests)+" 次"});
  }).catch(function(e){if(e.message!=="auth")console.error(e)});
  loadRows();
}
function card(k,v,sub){return '<div class="card"><div class="k">'+k+'</div><div class="v">'+v+(sub||"")+'</div></div>'}

function loadRows(){
  var r=rangeMs(),p=["from="+r.from,"to="+r.to,"page="+page,"page_size=50"];
  ["search","model","real","provider"].forEach(function(){});
  var v=function(id){return document.getElementById(id).value.trim()};
  if(v("f-search"))p.push("search="+encodeURIComponent(v("f-search")));
  if(v("f-model"))p.push("model="+encodeURIComponent(v("f-model")));
  if(v("f-real"))p.push("response_model="+encodeURIComponent(v("f-real")));
  if(v("f-provider"))p.push("provider="+encodeURIComponent(v("f-provider")));
  if(v("f-failed"))p.push("failed="+v("f-failed"));
  api("?"+p.join("&")).then(function(res){
    var tb=document.getElementById("rows");
    tb.innerHTML=res.rows.map(function(r){
      var same=r.model===r.response_model||!r.response_model;
      var mm='<div class="model-map"><span class="req mono">'+esc(r.model)+'</span>';
      if(!same)mm+='<span class="arrow">→</span><span class="real mono">'+esc(r.response_model)+'</span>';
      mm+='</div>';
      return '<tr><td class="mono">'+fmtT(r.ts)+'</td><td class="mono">'+esc(shortEp(r.endpoint))+'</td>'+
        '<td class="mono">'+esc(r.api_key||"-")+'</td><td>'+mm+'</td>'+
        '<td class="mono">'+esc(r.provider)+'<br><span style="color:var(--muted)">'+esc(r.executor)+'</span></td>'+
        '<td class="mono">'+fmtN(r.input_tokens)+' / '+fmtN(r.output_tokens)+'</td>'+
        '<td class="mono">'+fmtN(r.latency_ms)+'ms</td>'+
        '<td>'+(r.failed?'<span class="pill err">'+r.status_code+'</span>':'<span class="pill ok">OK</span>')+'</td></tr>';
    }).join("")||'<tr><td colspan="8" class="note">暂无数据</td></tr>';
    var pages=Math.max(1,Math.ceil(res.total/50));
    document.getElementById("pageinfo").textContent="第 "+page+" / "+pages+" 页，共 "+fmtN(res.total)+" 条";
  }).catch(function(e){if(e.message!=="auth")console.error(e)});
}
function shortEp(e){e=String(e||"");var i=e.lastIndexOf("/");return i>=0&&e.length-i<28?e.slice(i+1):e}
document.getElementById("f-go").onclick=function(){page=1;loadRows()};
document.getElementById("prev").onclick=function(){if(page>1){page--;loadRows()}};
document.getElementById("next").onclick=function(){page++;loadRows()};
["f-search","f-model","f-real","f-provider"].forEach(function(id){
  document.getElementById(id).addEventListener("keydown",function(e){if(e.key==="Enter"){page=1;loadRows()}});
});
if(key)load();
})();
</script>
</body>
</html>
